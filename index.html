<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图床 · Telegraph-Image</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      darkMode: 'class',
      theme: {
        extend: {
          colors: { accent: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' } }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .drop-zone { border: 2px dashed #374151; transition: all 0.2s; }
    .drop-zone.dragover { border-color: #6366f1; background: rgba(99,102,241,0.08); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 24px; border-radius: 8px; font-size: 14px; animation: fadeInUp 0.2s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .spinner { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid #6366f1; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[#11111b] text-gray-200 min-h-screen flex flex-col">

  <!-- 导航 -->
  <nav class="bg-[#1e1e2e]/95 border-b border-gray-800">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <span class="text-lg font-semibold text-gray-100">📷 图床</span>
      <a href="/admin.html" class="text-sm text-gray-400 hover:text-gray-200 transition">管理 →</a>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="max-w-lg w-full">

      <!-- 标题 -->
      <div class="text-center mb-8">
        <div class="text-2xl font-bold text-gray-100 mb-2">拖拽上传</div>
        <div class="text-sm text-gray-500">支持 PNG / JPG / WebP / GIF，自动生成短链接</div>
      </div>

      <!-- 拖拽区域 -->
      <div id="dropZone" class="drop-zone rounded-2xl p-12 text-center cursor-pointer mb-4"
           ondragover="event.preventDefault(); this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="event.preventDefault(); this.classList.remove('dragover'); handleFiles(event.dataTransfer.files)"
           onclick="document.getElementById('fileInput').click()">
        <div class="text-5xl mb-4">📁</div>
        <div class="text-gray-400">点击选择或拖拽图片到此处</div>
        <div class="text-xs text-gray-600 mt-2">最大 20MB</div>
        <input id="fileInput" type="file" multiple accept="image/*" class="hidden" onchange="handleFiles(this.files)">
      </div>

      <!-- 进度 -->
      <div id="progress" class="hidden mb-4">
        <div class="flex items-center gap-3 mb-2">
          <div class="spinner"></div>
          <span id="progressText" class="text-sm text-gray-400">上传中...</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-1.5">
          <div id="progressBar" class="bg-accent-500 h-1.5 rounded-full transition-all" style="width:0%"></div>
        </div>
      </div>

      <!-- 结果 -->
      <div id="results" class="hidden space-y-2"></div>

      <!-- 如果没登录 -->
      <div id="loginHint" class="hidden text-center mt-6">
        <div class="text-sm text-gray-500">上传需要登录</div>
        <a href="/admin.html" class="inline-block mt-2 px-4 py-2 bg-accent-600 hover:bg-accent-500 text-white text-sm rounded-xl transition">去登录</a>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

<script>
function handleFiles(files) {
  if (!files.length) return;
  document.getElementById('results').classList.add('hidden');
  document.getElementById('results').innerHTML = '';
  uploadFiles(files);
}

async function uploadFiles(files) {
  const progress = document.getElementById('progress');
  const bar = document.getElementById('progressBar');
  const text = document.getElementById('progressText');
  progress.classList.remove('hidden');
  bar.style.width = '0%';

  const formData = new FormData();
  let valid = 0;
  for (const f of files) {
    if (f.type.startsWith('image/')) { formData.append('file', f); valid++; }
  }
  if (!valid) { text.textContent = '没有有效的图片文件'; setTimeout(() => progress.classList.add('hidden'), 2000); return; }

  text.textContent = `正在上传 ${valid} 张...`;
  bar.style.width = '30%';

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData, credentials: 'include' });
    bar.style.width = '80%';

    if (res.status === 401) {
      document.getElementById('loginHint').classList.remove('hidden');
      text.textContent = '请先登录';
      setTimeout(() => progress.classList.add('hidden'), 1500);
      return;
    }

    const data = await res.json();
    bar.style.width = '100%';
    setTimeout(() => { progress.classList.add('hidden'); bar.style.width = '0%'; }, 1000);

    const results = document.getElementById('results');
    results.classList.remove('hidden');
    results.innerHTML = '';

    if (data.results) {
      let ok = 0;
      const fragment = document.createDocumentFragment();
      for (const r of data.results) {
        if (r.src) {
          ok++;
          const fullUrl = document.location.origin + r.src;
          const div = document.createElement('div');
          div.className = 'flex items-center gap-2 bg-[#1e1e2e] rounded-xl px-4 py-3 border border-gray-800';
          div.innerHTML = '<span class="text-green-400 text-xs flex-shrink-0">✅</span>'
            + '<span class="text-xs text-gray-400 truncate flex-1">' + fullUrl + '</span>'
            + '<button onclick="copyUrl(\'' + fullUrl + '\')" class="flex-shrink-0 px-2 py-1 text-xs rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 transition">复制</button>';
          fragment.appendChild(div);
        }
      }
      results.appendChild(fragment);
      if (ok > 0) toast('✅ 上传成功 ' + ok + ' 张', 'success');
    }
    if (data.error) toast('❌ ' + data.error, 'error');
  } catch (e) {
    bar.style.width = '0%';
    progress.classList.add('hidden');
    toast('上传失败: ' + e.message, 'error');
  }
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => toast('✅ 已复制', 'success')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    toast('✅ 已复制', 'success');
  });
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  const colors = { success: 'bg-green-800 text-green-100', error: 'bg-red-800 text-red-100', info: 'bg-gray-800 text-gray-100' };
  el.className = `toast ${colors[type] || colors.info}`;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 2500);
}
</script>
</body>
</html>
